[package]
name = "recoverx"
version = "0.1.0"
edition = "2021"
description = "RecoverX — Data Recovery Tool"
authors = ["RecoverX Team"]

[lib]
name = "recoverx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "recoverx"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
recoverx-core = { path = "../crates/recoverx-core" }
recoverx-storage = { path = "../crates/recoverx-storage" }
recoverx-devices = { path = "../crates/recoverx-devices" }
recoverx-orchestrator = { path = "../crates/recoverx-orchestrator" }
recoverx-engines = { path = "../crates/recoverx-engines" }
recoverx-logging = { path = "../crates/recoverx-logging" }

tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
dirs-next = "2.0"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
