[package]
name = "recoverx-devices"
version.workspace = true
edition.workspace = true
description = "Platform-specific device enumeration for RecoverX"

[dependencies]
recoverx-core = { path = "../recoverx-core" }
recoverx-storage = { path = "../recoverx-storage" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "ioapiset", "winioctl", "handleapi", "errhandlingapi"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
